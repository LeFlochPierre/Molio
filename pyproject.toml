[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cyp-selectivity-pilot"
version = "0.1.0"
description = "IsoForm: exploratory molecular counter-screening, 3D pockets and traceable UMA workflows"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["numpy", "ase"]
browser = ["playwright>=1.50,<2"]
video = ["playwright>=1.50,<2", "imageio-ffmpeg==0.6.0"]

[project.scripts]
isoform = "cyp_pipeline.sentinel_server:main"
cyp = "cyp_pipeline.cli:main"
cyp-sentinel = "cyp_pipeline.sentinel:main"
cyp-sentinel-demo = "cyp_pipeline.sentinel_demo:main"
cyp-sentinel-server = "cyp_pipeline.sentinel_server:main"
cyp-screen-plan = "cyp_pipeline.screening:main"
cyp-uma-batch = "cyp_pipeline.uma_batch:main"
isoform-inputs = "cyp_pipeline.auto_inputs:main"

[tool.setuptools.packages.find]
include = ["cyp_pipeline*"]

[tool.setuptools.package-data]
cyp_pipeline = ["web/*.html", "web/*.css", "web/*.js", "data/*.json"]
