[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "molio"
version = "0.1.0"
description = "A local molecular workspace for chemical design, 3D inspection and traceable Boltz comparisons"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
chemistry = ["rdkit==2026.3.6"]
browser = ["playwright>=1.50,<2"]
video = ["playwright>=1.50,<2", "imageio-ffmpeg==0.6.0"]

[project.scripts]
molio = "molio.server:main"

[tool.setuptools.packages.find]
include = ["molio", "molio.*"]

[tool.setuptools.package-data]
molio = ["web/*.json", "web/*.svg", "web/*.html", "web/*.css", "web/*.js", "web/vendor/*", "data/*.json", "data/sources/*", "data/structures/*", "data/depictions/*"]
