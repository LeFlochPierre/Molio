name: Molio checks

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install .
      - run: python -m unittest discover -s tests
      - name: Installed package entry point
        working-directory: /tmp
        run: molio --help
  chemistry-and-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[chemistry,browser]'
      - run: python -m unittest discover -s tests
      - run: python -m playwright install --with-deps chromium
      - name: Offline browser smoke checks
        run: |
          python scripts/check_molio_startup.py
          python scripts/check_molio_navigation.py
          python scripts/check_molio_designs.py
          python scripts/check_molio_workspace_delete.py
